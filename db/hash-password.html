<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Generate admin password hash</title>
  <style>
    body {
      background: #0e0d11; color: #f5f5f7; min-height: 100vh; margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex; align-items: center; justify-content: center; padding: 24px;
    }
    .box { max-width: 620px; width: 100%; }
    h1 { font-size: 1.1rem; letter-spacing: 0.12em; text-transform: uppercase; margin: 0 0 6px; }
    .sub { font-size: 0.82rem; color: #94939c; line-height: 1.6; margin-bottom: 26px; }
    label { display: block; font-size: 0.68rem; letter-spacing: 0.14em; text-transform: uppercase; color: #62616c; margin-bottom: 7px; }
    input, textarea {
      width: 100%; box-sizing: border-box; background: #14131a; color: #f5f5f7;
      border: 1px solid rgba(255,255,255,0.12); border-radius: 6px;
      padding: 13px 14px; font-family: ui-monospace, Menlo, monospace; font-size: 0.88rem;
    }
    input:focus, textarea:focus { outline: none; border-color: #00d2ff; }
    .field { margin-bottom: 18px; }
    button {
      font-family: inherit; font-size: 0.78rem; font-weight: 600; letter-spacing: 0.08em;
      padding: 14px 26px; border-radius: 999px; border: 1px solid #fff;
      background: #fff; color: #0b0a0e; cursor: pointer; margin-top: 6px;
    }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .status { font-family: ui-monospace, Menlo, monospace; font-size: 0.76rem; margin-top: 16px; min-height: 1.2em; }
    .ok { color: #00d2ff; } .err { color: #ff8a8a; }
    .warn { color: #d4a373; font-size: 0.78rem; line-height: 1.6; margin-top: 24px; padding-top: 18px; border-top: 1px solid rgba(255,255,255,0.1); }
    .note { font-size: 0.76rem; color: #62616c; margin-top: 8px; }
    a { color: #00d2ff; }
  </style>
</head>
<body>
  <div class="box">
    <h1>Admin password hash</h1>
    <p class="sub">Type your admin password below. It is hashed <strong>entirely on this page</strong> using your browser's built-in Web Crypto — nothing is sent anywhere. Copy the result into your Vercel environment variable <code>ADMIN_PASSWORD_HASH</code>.</p>

    <div class="field">
      <label for="pw">Password (12+ characters)</label>
      <input id="pw" type="password" autocomplete="new-password" placeholder="choose a strong password">
    </div>

    <button id="go" type="button">GENERATE HASH</button>
    <p class="status" id="status"></p>

    <div class="field" id="out-field" hidden style="margin-top:22px">
      <label for="out">Your ADMIN_PASSWORD_HASH value</label>
      <textarea id="out" rows="3" readonly></textarea>
      <button id="copy" type="button" style="margin-top:10px">COPY TO CLIPBOARD</button>
      <p class="note">This is the only line you need. Close this tab afterwards.</p>
    </div>

    <p class="warn" id="warn" hidden></p>
  </div>

  <script>
    (function () {
      'use strict';

      var ITERATIONS = 600000;
      var SALT_BYTES = 16;
      var KEY_BITS = 256;

      var pw = document.getElementById('pw');
      var go = document.getElementById('go');
      var out = document.getElementById('out');
      var outField = document.getElementById('out-field');
      var status = document.getElementById('status');
      var warn = document.getElementById('warn');

      function setStatus(msg, kind) {
        status.textContent = msg;
        status.className = 'status' + (kind ? ' ' + kind : '');
      }

      function toHex(buffer) {
        var bytes = new Uint8Array(buffer);
        var hex = '';
        for (var i = 0; i < bytes.length; i++) {
          hex += bytes[i].toString(16).padStart(2, '0');
        }
        return hex;
      }

      go.addEventListener('click', function () {
        var password = pw.value;

        if (password.length < 12) {
          setStatus('Use at least 12 characters. This password unlocks your whole inbox.', 'err');
          outField.hidden = true;
          return;
        }

        if (!window.crypto || !window.crypto.subtle) {
          setStatus('This browser cannot do Web Crypto. Try Chrome, Safari, or Edge.', 'err');
          return;
        }

        go.disabled = true;
        setStatus('Hashing (takes a second)...');
        pw.value = '';
        outField.hidden = true;

        var salt = window.crypto.getRandomValues(new Uint8Array(SALT_BYTES));

        window.crypto.subtle.importKey(
          'raw',
          new TextEncoder().encode(password),
          { name: 'PBKDF2' },
          false,
          ['deriveBits']
        ).then(function (key) {
          return window.crypto.subtle.deriveBits(
            { name: 'PBKDF2', salt: salt, iterations: ITERATIONS, hash: 'SHA-256' },
            key,
            KEY_BITS
          );
        }).then(function (bits) {
          var value = 'pbkdf2-sha256$' + ITERATIONS + '$' + toHex(salt) + '$' + toHex(bits);
          out.value = value;
          outField.hidden = false;
          setStatus('Done. Copy the value below.', 'ok');
        }).catch(function (err) {
          setStatus('Could not hash: ' + (err && err.message ? err.message : 'unknown error'), 'err');
        }).then(function () {
          go.disabled = false;
        });
      });

      document.getElementById('copy').addEventListener('click', function () {
        out.select();
        out.setSelectionRange(0, 99999);
        try {
          document.execCommand('copy');
          setStatus('Copied.', 'ok');
        } catch (e) {
          setStatus('Select the text and copy manually.', 'err');
        }
      });
    })();
  </script>
</body>
</html>
